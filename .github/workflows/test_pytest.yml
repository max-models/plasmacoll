name: Test Pytest

on:
  push:
    branches:
      - main
      - devel
  pull_request:
    branches:
      - main
      - devel

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # fake-cupy runs the CuPy code paths on cunumpy's host-memory stand-in for CuPy
        backend: [numpy, fake-cupy]

    env:
      CUNUMPY_FAKE_CUPY: ${{ matrix.backend == 'fake-cupy' && '1' || '' }}
      CUNUMPY_BACKEND: ${{ matrix.backend == 'fake-cupy' && 'cupy' || 'numpy' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      - name: Check the backend
        run: uv run python -c "import cunumpy as xp; print(xp.get_backend()); assert xp.get_backend() == '${{ env.CUNUMPY_BACKEND }}'"

      - name: Run tests with coverage
        run: uv run pytest -p no:cacheprovider --cov --cov-report=xml --cov-report=term .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: python-${{ matrix.python-version }}-${{ matrix.backend }}
          fail_ci_if_error: false

  coverage:
    name: combined coverage (NumPy + fake CuPy) is 100%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project
        run: uv sync --extra test

      - name: Run both backends and combine
        run: make coverage
