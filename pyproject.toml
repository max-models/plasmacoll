[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "plasmacoll"
version = "0.2.0"
description = "Null-collision Monte Carlo collisions of charged particles with neutral gases, on NumPy or CuPy arrays."
readme = "README.md"
keywords = [ "cross sections", "cupy", "lxcat", "monte carlo collisions", "negative ions", "null collision", "particle-in-cell", "plasma" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cunumpy>=0.5",
  "numpy",
  "scope-profiler>=0.7.5",
]

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "ty",
  "plasmacoll[test,docs]",
]
optional-dependencies.docs = [
  "griffe",
  "ipykernel",
  "matplotlib",
  "nbclient>=0.11.0",
  "nbformat>=5.11.1",
]
optional-dependencies.test = [ "pytest", "pytest-cov" ]
urls."Source" = "https://github.com/max-models/plasmacoll"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# scratch scripts kept for re-checking results; README.md is rendered from README.qmd, so
# `make readme-check` checks its example explicitly instead of letting `ruff format .` edit it
extend-exclude = [ ".claude", "README.md" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]

[tool.pyright]
include = [ "src" ]
venvPath = "."
venv = ".venv"
exclude = [ "**/tests" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"
# the kinematics tests make every marker collide in one step on purpose; the warning
# itself is tested explicitly in test_mcc_extensions.py
filterwarnings = [ "ignore:.*collision probability per step:RuntimeWarning" ]

[tool.coverage.run]
source = [ "plasmacoll" ]
omit = [ "*/tests/*" ]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python = ".venv"
python-version = "3.10"

[tool.ty.src]
include = [ "src" ]

[tool.ty.analysis]
# CuPy is optional and not installed in CI
allowed-unresolved-imports = [ "cupy" ]

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
