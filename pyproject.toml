[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "plasmacoll"
version = "0.6.0"
description = "Null-collision Monte Carlo collisions of charged particles with neutral gases, on NumPy or CuPy arrays."
readme = "README.md"
keywords = [ "cross sections", "cupy", "lxcat", "monte carlo collisions", "negative ions", "null collision", "particle-in-cell", "plasma" ]
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cunumpy>=0.7.2",
  "methodcard",
  "numpy",
  # the CPU kernels of the Coulomb collisions: compiled on first use; not in the browser
  # (Pyodide), which has no compiler: the kernels run their NumPy versions there
  "pyccel>2.0; sys_platform!='emscripten'",
  "scope-profiler>=0.7.5",
]

optional-dependencies.dev = [
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
  "ty",
  "plasmacoll[test,docs]",
]
optional-dependencies.docs = [
  "astropy",
  "griffe",
  "ipykernel",
  "matplotlib",
  "nbclient>=0.11.0",
  "nbformat>=5.11.1",
  "plasma-plots[web]>=0.2.3",
]
optional-dependencies.test = [ "astropy", "methodcard[symbolic]", "pytest", "pytest-cov" ]
optional-dependencies.units = [ "astropy" ]
urls."Source" = "https://github.com/max-models/plasmacoll"

[project.entry-points."scope_profiler.opt_in_tags"]
plasmacoll = "plasmacoll"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
"*" = [ "py.typed" ]
plasmacoll = [ "kernels/*.cuh", "kernels/*/*.cu" ]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# scratch scripts kept for re-checking results; README.md is rendered from README.qmd, so
# `make readme-check` checks its example explicitly instead of letting `ruff format .` edit it
extend-exclude = [ ".claude", "README.md" ]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
select = [ "B", "D", "E", "F", "I", "UP", "W" ]
ignore = [ "E501" ] # line length is handled by the formatter
pydocstyle.convention = "google"
per-file-ignores."**/tests/**" = [ "D" ]
per-file-ignores."*.ipynb" = [ "D" ]
# the Pyccel kernels: type annotations Pyccel reads, plain helper functions
per-file-ignores."src/plasmacoll/kernels/*/*_pyccel.py" = [ "D", "F722", "F821", "UP" ]

[tool.pyright]
include = [ "src" ]
venvPath = "."
venv = ".venv"
exclude = [ "**/tests", "src/plasmacoll/kernels/*/*_pyccel.py" ]
pythonVersion = "3.10"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "src" ]
addopts = "-ra"
markers = [ "convergence: an order-of-accuracy test of a method card" ]
# the kinematics tests make every marker collide in one step on purpose; the warning
# itself is tested explicitly in test_mcc_extensions.py
filterwarnings = [ "ignore:.*collision probability per step:RuntimeWarning" ]

[tool.coverage.run]
source = [ "plasmacoll" ]
# the Pyccel kernels run compiled (the tests compare them with their NumPy versions)
omit = [ "*/kernels/*/*_pyccel.py", "*/tests/*" ]

[tool.coverage.report]
show_missing = true

[tool.ty.environment]
python = ".venv"
python-version = "3.10"

[tool.ty.src]
include = [ "src" ]
# the Pyccel kernels: Pyccel's array annotations, e.g. float[:]
exclude = [ "src/plasmacoll/kernels/*/*_pyccel.py" ]

[tool.ty.analysis]
# CuPy is optional and not installed in CI
allowed-unresolved-imports = [ "cupy" ]

# the tests pass quantities as strings to settings annotated as floats
[[tool.ty.overrides]]
include = [ "src/plasmacoll/tests/**" ]
rules = { invalid-argument-type = "ignore" }

# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
[tool.uv.sources]
cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
methodcard = { git = "https://github.com/max-models/methodcard", branch = "devel" }
plasma-plots = { git = "https://github.com/max-models/plasma-plots", branch = "devel" }
scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }
